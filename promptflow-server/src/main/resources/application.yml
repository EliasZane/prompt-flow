# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    # URI编码
    uri-encoding: UTF-8
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
# Spring 配置
spring:
  config:
    import: optional:classpath:secrets.txt
  application:
    name: prompt-flow
  # 编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3307/promptflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: PromptFlowHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

# AI 外部接口配置
ai:
  deepseek:
    api-key: ${ai.deepseek.api-key}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.promptflow.**.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.promptflow: DEBUG

jwt:
  secret: ${jwt.secret}
  expiration: 604800 # 7 days (in seconds)

# 阿里云短信配置
aliyun:
  sms:
    access-key-id: ${aliyun.sms.access-key-id}
    access-key-secret: ${aliyun.sms.access-key-secret}
    endpoint: dysmsapi.aliyuncs.com
    region: cn-hangzhou
    sign-name: 速通互联验证码
    template-code: 100001

# 支付宝配置
pay:
  alipay:
    server-url: https://openapi.alipay.com/gateway.do
    app-id: ${pay.alipay.app-id}
    private-key: ${pay.alipay.private-key}
    alipay-public-key: ${pay.alipay.alipay-public-key}
    notify-url: https://promptflowai.cn/api/membership/pay/notify/alipay
    return-url: https://promptflowai.cn/personal-center?tab=recharge
    sign-type: RSA2
    charset: UTF-8
    format: json
